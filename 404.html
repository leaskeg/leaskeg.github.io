    :root {

      --a1: #2ee6c5; --a2: #3d7bff; --a3: #a78bfa;

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {

    @keyframes d2 { to { transform: translate(16vw, -12vh) scale(.9); } }
    main { text-align: center; max-width: 560px; }

      background: var(--grad); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 8s linear infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .label { font-family: "JetBrains Mono", monospace; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--a1); margin: 18px 0 0; }
    h1 { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: clamp(1.5rem, 5vw, 2.1rem); letter-spacing: -.03em; line-height: 1.2; margin: 10px 0 0; }
    p { color: var(--text-2); margin: 12px 0 0; }
    a.btn {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; min-height: 50px; padding: 0 24px; border-radius: 12px;

      box-shadow: 0 14px 40px -14px var(--a2); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn:focus-visible { outline: 2px solid var(--a1); outline-offset: 3px; }
    a.btn svg { width: 18px; height: 18px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
